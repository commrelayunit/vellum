<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Vellum</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/vellum-mark.svg" type="image/svg+xml">
</head>
<body data-page="projects">
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <div class="menu-wrap">
                    <button class="menu-button" id="menu-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false" title="Menu">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <circle cx="12" cy="5" r="1.4"/>
                            <circle cx="12" cy="12" r="1.4"/>
                            <circle cx="12" cy="19" r="1.4"/>
                        </svg>
                    </button>
                    <div class="menu-dropdown" id="menu-dropdown" role="menu">
                        <a href="/projects#new-project" class="menu-item" data-menu-action="new-project" role="menuitem">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 5v14"/>
                                <path d="M5 12h14"/>
                            </svg>
                            <span>New project</span>
                        </a>
                        <a href="/projects" class="menu-item" data-menu-action="overview" role="menuitem">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 11l8-7 8 7"/>
                                <path d="M6 10v9h12v-9"/>
                            </svg>
                            <span>Back to projects</span>
                        </a>
                    </div>
                </div>
                <h1 class="app-title">Vellum</h1>
            </div>
        </header>
        
        <main class="app-main">
            <div class="projects-page">
                <div class="page-header">
                    <h2>Projects</h2>
                    <button class="btn btn-primary" id="new-project-btn" aria-label="New project" title="New project">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 5v14"/>
                            <path d="M5 12h14"/>
                        </svg>
                    </button>
                </div>
                
                <div class="projects-list">
                    <div class="project-card">
                        <div class="project-info">
                            <h3>Sample Project</h3>
                            <p class="project-description">A sample project for demonstration</p>
                            <div class="project-meta">
                                <span class="file-count">4 files</span>
                                <time data-updated="2026-08-13T06:00:00Z">updated recently</time>
                            </div>
                            <div class="recent-files">
                                <span>README.md</span>
                                <span>Draft.md</span>
                                <span>Notes.md</span>
                            </div>
                        </div>
                        <div class="project-actions">
                            <a href="/writing?project=1" class="btn btn-secondary" aria-label="Open Sample Project" title="Open">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M5 12h14"/>
                                    <path d="M13 6l6 6-6 6"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                    
                    <div class="project-card">
                        <div class="project-info">
                            <h3>Documentation</h3>
                            <p class="project-description">Project documentation and notes</p>
                            <div class="project-meta">
                                <span class="file-count">1 file</span>
                                <time data-updated="2026-08-11T10:00:00Z">updated recently</time>
                            </div>
                            <div class="recent-files">
                                <span>README.md</span>
                            </div>
                        </div>
                        <div class="project-actions">
                            <a href="/writing?project=2" class="btn btn-secondary" aria-label="Open Documentation" title="Open">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M5 12h14"/>
                                    <path d="M13 6l6 6-6 6"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/js/main.js"></script>
</body>
</html>
